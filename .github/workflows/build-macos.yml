# Builds the macOS application (StoppedFlowKinetiX.app in a .dmg) on GitHub's Mac machines:
#  - automatically when a release is published on GitHub (the .dmg files are attached to the release),
#  - or by hand: Actions > "Build macOS app" > Run workflow (the .dmg files are then under the run's
#    "Artifacts").
# Two builds: Apple Silicon (M1 and newer) and Intel Macs. The app is not signed by an Apple
# developer account, so macOS asks once to allow it (see "Read me first.txt" in the .dmg).

name: Build macOS app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write          # to attach the .dmg files to the release

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel (GitHub offers Intel Macs until about 2027)
            arch: Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build the app
        run: pyinstaller --noconfirm --clean StoppedFlowKinetiX.spec

      - name: Test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/StoppedFlowKinetiX.app/Contents/MacOS/StoppedFlowKinetiX --self-test

      - name: Make the .dmg
        id: dmg
        run: |
          VERSION=$(python -c "from src.version import APP_VERSION; print(APP_VERSION)")
          NAME="StoppedFlowKinetiX_${VERSION}_macOS_${{ matrix.arch }}.dmg"
          mkdir dmg
          cp -R dist/StoppedFlowKinetiX.app dmg/
          ln -s /Applications dmg/Applications
          cp installer_assets/macOS_read_me_first.txt "dmg/Read me first.txt"
          hdiutil create -volname "StoppedFlowKinetiX ${VERSION}" -srcfolder dmg -ov -format UDZO "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.file }}
          path: ${{ steps.dmg.outputs.file }}
          retention-days: 30

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.dmg.outputs.file }}" --clobber
